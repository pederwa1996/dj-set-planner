# Render Blueprint: appen bygges og serveres som en gratis statisk side.
# Dataene lagres fortsatt bare i nettleseren til den som bruker appen.
services:
  - type: web
    name: dj-set-planner
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    # Proxy til musikk-API-ene (unngår CORS). Samme stier som i vite.config.ts.
    routes:
      - type: rewrite
        source: /api/getsongbpm/*
        destination: https://api.getsong.co/*
      - type: rewrite
        source: /api/deezer/*
        destination: https://api.deezer.com/*
